name: Price watch

on:
  schedule:
    # GitHub schedules run on UTC time. These two lines cover 9am to 3am Toronto time
    # in both winter and summer. The script skips any run outside those hours.
    - cron: "0,30 13-23 * * *"
    - cron: "0,30 0-8 * * *"
  workflow_dispatch: # adds a "Run workflow" button so you can test it any time

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Toronto
      PRICE_ALERT_FROM: ${{ secrets.PRICE_ALERT_FROM }}
      PRICE_ALERT_APP_PASSWORD: ${{ secrets.PRICE_ALERT_APP_PASSWORD }}
      PRICE_ALERT_TO: ${{ secrets.PRICE_ALERT_TO }}
      PRICE_ALERT_TARGET_CAD: ${{ vars.PRICE_ALERT_TARGET_CAD }}

    steps:
      - name: Get the script
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the time
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || python price_watch.py --check-window; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the hidden browser
        if: steps.window.outputs.run == 'true'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Load what the watcher remembers
        if: steps.window.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            price_watch_state.json
            price_watch_log.csv
          key: price-watch-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: price-watch-state-

      - name: Check the price
        if: steps.window.outputs.run == 'true'
        run: python price_watch.py --once

      - name: Save what the watcher remembers
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            price_watch_state.json
            price_watch_log.csv
          key: price-watch-state-${{ github.run_id }}-${{ github.run_attempt }}
